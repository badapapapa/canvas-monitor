# Canvas sync. SPEC.md section 11; DECISIONS.md D-07, D-10, D-43.
#
# Adaptive cadence, expressed in UTC because Actions cron is UTC-only (D-75):
#   every 10 min 08:07-22:57 SGT  ->  :07 :17 :27 :37 :47 :57, 00-14 UTC
#   every 30 min 23:13-07:43 SGT  ->  :13 :43, 15-23 UTC
# 108 runs/day. Off the top of the hour and off :00/:15/:20/:30/:40/:45, where
# GitHub's scheduler is busiest and most likely to delay or drop an event. A
# dropped slot now costs 10 minutes by day. The database lock prevents overlap.
# Unlimited minutes because this repository is public (D-10).
#
# Everything this job prints is public. Logs are redacted by default and
# --unsafe-log is refused under CI; never add LOG_LEVEL=debug here.

name: sync

on:
  schedule:
    - cron: '7,17,27,37,47,57 0-14 * * *'
    - cron: '13,43 15-23 * * *'
  workflow_dispatch: {}

# Deliberately NO `concurrency:` group (DECISIONS.md D-46).
#
# On 2026-09-13 one run was never assigned a runner. It sat queued for 24 hours,
# holding the group, and the group cancelled the 51 runs queued behind it: a
# single lost job became a day-long outage. `timeout-minutes` could not help,
# because it only counts once a job starts. Without the group a lost job costs
# its own slot and nothing else.
#
# Overlap is still prevented where it matters: `sync_lock` is taken with a
# conditional UPDATE, so a second concurrent run skips, and the timeout below
# is shorter than the lock's 15-minute staleness window.

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # Shorter than the 15-minute sync_lock staleness window, so a hung run
    # cannot outlive its own lock and let the next run overlap it (D-07).
    timeout-minutes: 10
    steps:
      # Pinned to commit SHAs, not tags: this job holds the Turso credentials,
      # and a public repo is exactly where a retagged upstream action would bite.
      # v5 of both actions runs on the node24 runtime; v4 ran on node20, which
      # GitHub is deprecating and which annotated every run.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Native TypeScript type stripping; no build step (D-14).
          node-version: 24
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Sync
        run: node src/cli/index.ts sync
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # The dashboard's read model (D-65): a SEPARATE database. This token
          # can write the read model only; it cannot reach the main database.
          # Absent: the sync simply does not publish.
          READMODEL_DATABASE_URL: ${{ secrets.READMODEL_DATABASE_URL }}
          READMODEL_WRITE_TOKEN: ${{ secrets.READMODEL_WRITE_TOKEN }}
          # GitHub exposes which cron fired, not when it was meant to. The run
          # reconstructs its slot from this to measure drift (D-43).
          CRON_SCHEDULE: ${{ github.event.schedule }}
